         name and different icons; two identities, and the last one won. -->
    <!-- No static canonical here on purpose: <CanonicalUrl /> emits the per-route
         canonical and og:url. A single hard-coded value on every URL told crawlers
         that /platform, /about and all dispatches were duplicates of the homepage. -->
