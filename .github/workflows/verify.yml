name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / build / guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint (zero warnings tolerated)
        run: npx eslint . --max-warnings=0

      - name: Unit tests
        # Edge functions (auth credential resolution, sitemap entities and zones,
        # asset 404s) plus the PWA update policy. The failure surfaces covered here
        # are the ones that are silent in production.
        run: npm test

      - name: Build (Vite + Cloudflare SPA fallback)
        run: npm run build

      - name: Assert build artifacts
        run: |
          set -euo pipefail
          missing=0
          for artifact in dist/index.html dist/200.html dist/sw.js dist/_headers dist/_redirects; do
            if [ -f "$artifact" ]; then
              echo "ok    $artifact"
            else
              echo "MISSING $artifact"
              missing=1
            fi
          done
          exit "$missing"

      - name: Assert no sourcemaps ship
        run: |
          set -euo pipefail
          # build.sourcemap was true until Sprint 2.15, so ~4.0 MB of
          # /assets/<chunk>.js.map was served from the public origin next to a
          # 900 kB bundle: the full application source, readable by anyone, and
          # consumed by nothing (no error reporter receives an upload). The
          # setting is one line and easy to restore "for debugging", so the
          # invariant is asserted here rather than trusted.
          maps=$(find dist -name '*.map' -print)
          if [ -n "$maps" ]; then
            echo "::error::Sourcemaps are shipping to the CDN: $maps"
            exit 1
          fi
          echo "ok    no sourcemaps in dist"

      - name: Assert no legacy infrastructure references in the bundle
        run: |
          set -euo pipefail
          # Guardrail: the deployed app must never call legacy/Bluehost infrastructure.
          # api.axim.us.com 302s to a Bluehost 404 and is permanently dead.
          # Sourcemaps and _headers comments are excluded: a note explaining that a
          # host is forbidden is not a reference to it.
          fail=0

          # Active directives only: strip comment lines from the Pages files.
          for file in dist/_headers dist/_redirects; do
            [ -f "$file" ] || continue
            if grep -v '^[[:space:]]*#' "$file" | grep -Eq 'api\.axim\.us\.com|w3schools\.com'; then
              echo "::error::Legacy host referenced in $file"
              fail=1
            fi
          done

          # Shipped code, excluding sourcemaps.
          while IFS= read -r file; do
            if grep -Eq 'api\.axim\.us\.com|w3schools\.com' "$file"; then
              echo "::error::Legacy host referenced in $file"
              fail=1
            fi
          done < <(find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) ! -name '*.map')

          [ "$fail" -eq 0 ] || exit 1
          echo "ok    no legacy hosts in bundle"

      - name: Assert the Supabase client actually ships
        run: |
          set -euo pipefail
          # A build made without the anon key once tree-shook @supabase/supabase-js
          # out of the artifact completely, which silently disabled login,
          # /dashboard, the Vault and every media upload while the public pages
          # kept working. The SDK is dynamically imported and config is resolved
          # at runtime, so a client chunk must exist in every build — key or no key.
          if ! find dist/assets -name '*.js' -print0 | xargs -0 grep -l 'GoTrueClient' | grep -q .; then
            echo "::error::No Supabase SDK code in dist/assets — auth would be dead in production."
            exit 1
          fi
          echo "ok    supabase client present in the build"

      - name: Assert the social card ships and resolves
        run: |
          set -euo pipefail
          # index.html advertised /screenshot_home.png as og:image for a month. The
          # file was never committed, so every shared link previewed with no image
          # and the request was answered by the SPA shell with a 200.
          #
          # Resolve the advertised path rather than naming a file here: the card is
          # versioned by filename (Sprint 2.13), so a hard-coded name is a guard
          # that fails on a rename instead of on a missing asset.
          advertised=$(grep -o 'property="og:image" content="https://ellars\.us\.com/[^"]*"' dist/index.html | head -1 | sed 's#.*ellars\.us\.com/##; s#"$##')
          if [ -z "$advertised" ]; then
            echo "::error::dist/index.html declares no og:image — every social preview would be blank."
            exit 1
          fi
          if [ ! -f "dist/$advertised" ]; then
            echo "::error::og:image points at /$advertised, which is not in the build."
            exit 1
          fi
          echo "ok    og:image ships: /$advertised"

      - name: Assert single PWA manifest identity
        run: |
          set -euo pipefail
          count=$(grep -c 'rel="manifest"' dist/index.html || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::dist/index.html links $count manifests; exactly one is required."
            exit 1
          fi
          echo "ok    exactly one manifest link"
